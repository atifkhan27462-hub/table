user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-Performance File Streaming & TCP Buffering
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip Compression Optimization (Phase 16 Performance)
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Microservice Definitions
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream customer_app {
        server customer-app:3000;
        keepalive 32;
    }

    upstream admin_dashboard {
        server admin-dashboard:3001;
        keepalive 32;
    }

    upstream kds_app {
        server kds-app:3002;
        keepalive 32;
    }

    # -------------------------------------------------------------
    # HTTP Server (Port 80): ACME Validation & HTTPS Redirect
    # -------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME Challenge Directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health & Readiness Probes (Permit unencrypted probes from internal load balancers)
        location = /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        location = /ready {
            proxy_pass http://backend_api/ready;
            access_log off;
        }

        # Global Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server (Port 443): SSL Termination & Service Reverse Proxy
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates
        ssl_certificate     /etc/nginx/ssl/smart_table.crt;
        ssl_certificate_key /etc/nginx/ssl/smart_table.key;

        # Modern TLS Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HTTP Security Hardening Headers (Phase 14 & 17)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # 1. Health & Readiness Orchestration Probes
        location = /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        location = /ready {
            proxy_pass http://backend_api/ready;
            access_log off;
        }

        # 2. REST API V1 Endpoints
        location /api/ {
            proxy_pass http://backend_api;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            client_max_body_size 25M;
        }

        # 3. Interactive Documentation
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
        }

        # 4. Real-Time WebSocket Engine (Bidirectional Streaming & Keepalives)
        location ~ ^/(ws|api/v1/ws) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 5. Kitchen Display System (KDS App - Line Cook Touchscreens)
        location /kitchen/ {
            proxy_pass http://kds_app/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 6. Restaurant Executive Admin Dashboard
        location /admin/ {
            proxy_pass http://admin_dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 7. Customer Table Touchscreen Experience (Default Root App)
        location / {
            proxy_pass http://customer_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server: Kitchen Display System Subdomain (e.g. kds.*, kitchen.*)
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ~^(kds\..*|kitchen\..*)$;

        ssl_certificate     /etc/nginx/ssl/smart_table.crt;
        ssl_certificate_key /etc/nginx/ssl/smart_table.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /health { proxy_pass http://backend_api/health; }
        location = /ready { proxy_pass http://backend_api/ready; }
        location /api/ { proxy_pass http://backend_api; }
        location ~ ^/(ws|api/v1/ws) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location / {
            proxy_pass http://kds_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------
    # HTTPS Server: Restaurant Admin Dashboard Subdomain (e.g. admin.*)
    # -------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ~^(admin\..*)$;

        ssl_certificate     /etc/nginx/ssl/smart_table.crt;
        ssl_certificate_key /etc/nginx/ssl/smart_table.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /health { proxy_pass http://backend_api/health; }
        location = /ready { proxy_pass http://backend_api/ready; }
        location /api/ { proxy_pass http://backend_api; }
        location ~ ^/(ws|api/v1/ws) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location / {
            proxy_pass http://admin_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
