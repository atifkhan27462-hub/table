version: '3.8'

# =============================================================================
# Smart Interactive Dining Table Platform — Full Stack Infrastructure
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: smart_table_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_table}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_table}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: smart_table_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --protected-mode yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart_table_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smart_table}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal_net

  customer-app:
    build:
      context: ../apps/customer-app
      dockerfile: Dockerfile
    container_name: smart_table_customer_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - internal_net

  admin-dashboard:
    build:
      context: ../apps/admin-dashboard
      dockerfile: Dockerfile
    container_name: smart_table_admin_dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - internal_net

  kds-app:
    build:
      context: ../apps/kds-app
      dockerfile: Dockerfile
    container_name: smart_table_kds_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
    networks:
      - internal_net

  nginx:
    image: nginx:1.27-alpine
    container_name: smart_table_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
      - customer-app
      - admin-dashboard
      - kds-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - internal_net

  db-backup:
    image: postgres:16-alpine
    container_name: smart_table_db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smart_table}
      RETENTION_DAYS: 14
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - db_backups:/backups
    entrypoint: |
      sh -c '
        chmod +x /backup.sh
        echo "0 3 * * * /backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        echo "Starting daily backup scheduler (03:00 UTC)..."
        /backup.sh
        crond -f -l 2
      '
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  db_backups:
    driver: local

networks:
  internal_net:
    driver: bridge
